name: Build Linera ARM64 Android

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Required to create releases

jobs:
  build-android-arm64:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hour timeout for compilation
    
    env:
      ANDROID_NDK_VERSION: r26d
      API_LEVEL: "24"
    
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning
          
      - name: Generate version
        id: version
        run: |
          # Generate version: v{YYYY.MM.DD}-{short-commit-hash}
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"
          
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} already exists, skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.version.outputs.version }} does not exist, proceeding with build"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Checkout linera-protocol
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: linera-io/linera-protocol
          ref: v0.15.8  # Use tag compatible with testnet-conway faucet
          path: linera-protocol
          
      - name: Install Rust and add Android target
        if: steps.check_release.outputs.exists == 'false'
        working-directory: linera-protocol
        run: |
          # Let rustup use the toolchain specified in linera-protocol's rust-toolchain.toml
          rustup show
          # Add Android ARM64 target to the active toolchain
          rustup target add aarch64-linux-android
        
      - name: Setup Android NDK
        if: steps.check_release.outputs.exists == 'false'
        run: |
          # Download Android NDK
          wget -q https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          unzip -q android-ndk-${ANDROID_NDK_VERSION}-linux.zip
          export ANDROID_NDK_HOME=$PWD/android-ndk-${ANDROID_NDK_VERSION}
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          
          # Set up toolchain paths
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          
          # Add to PATH
          echo "$TOOLCHAIN/bin" >> $GITHUB_PATH
          
      - name: Install build dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config cmake clang llvm
          
      - name: Configure cargo for Android
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          ar = "${TOOLCHAIN}/bin/llvm-ar"
          linker = "${TOOLCHAIN}/bin/aarch64-linux-android${API_LEVEL}-clang"
          EOF
          
      - name: Build for Android ARM64 with RocksDB
        if: steps.check_release.outputs.exists == 'false'
        working-directory: linera-protocol
        env:
          CC_aarch64_linux_android: ${{ env.TOOLCHAIN }}/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang
          CXX_aarch64_linux_android: ${{ env.TOOLCHAIN }}/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang++
          AR_aarch64_linux_android: ${{ env.TOOLCHAIN }}/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.TOOLCHAIN }}/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang
          # Android NDK sysroot for cross-compilation
          TARGET_CC: ${{ env.TOOLCHAIN }}/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang
          TARGET_CXX: ${{ env.TOOLCHAIN }}/bin/aarch64-linux-android${{ env.API_LEVEL }}-clang++
          TARGET_AR: ${{ env.TOOLCHAIN }}/bin/llvm-ar
          # Disable compression in librocksdb-sys build
          ROCKSDB_LZ4: "0"
          ROCKSDB_ZSTD: "0"
          ROCKSDB_SNAPPY: "0"
          ROCKSDB_ZLIB: "0"
          ROCKSDB_BZIP2: "0"
          # Additional flags to disable compression
          CXXFLAGS: "-DROCKSDB_LITE -DSNAPPY=0 -DLZ4=0 -DZSTD=0 -DZLIB=0"
        run: |
          # Build linera with RocksDB support
          # librocksdb-sys will build RocksDB from source with compression disabled
          cargo build -p linera-service --release \
            --target aarch64-linux-android \
            --features rocksdb,wasmer
            
      - name: Prepare release assets
        if: steps.check_release.outputs.exists == 'false'
        run: |
          mkdir -p release-assets
          cp linera-protocol/target/aarch64-linux-android/release/linera release-assets/linera-android-arm64
          chmod +x release-assets/linera-android-arm64
          
          # Create checksum
          cd release-assets
          sha256sum linera-android-arm64 > SHA256SUMS.txt
          
      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Linera Android ARM64 ${{ steps.version.outputs.version }}
          body: |
            ## Linera CLI for Android ARM64 (with RocksDB)
            
            **Version:** ${{ steps.version.outputs.version }}
            **Build Date:** ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}
            **Commit:** ${{ github.sha }}
            **Features:** RocksDB, Wasmer
            
            ### Installation (Termux)
            
            ```bash
            # Download the binary
            curl -L -o linera https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/linera-android-arm64
            
            # Make it executable
            chmod +x linera
            
            # Move to PATH (optional)
            mv linera $PREFIX/bin/
            
            # Verify installation
            linera --version
            
            # Initialize wallet with faucet
            linera wallet init --faucet https://faucet.testnet-conway.linera.net
            ```
            
            ### Checksums
            See `SHA256SUMS.txt` for verification.
          files: |
            release-assets/linera-android-arm64
            release-assets/SHA256SUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload artifact (backup)
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: linera-android-arm64-${{ steps.version.outputs.version }}
          path: release-assets/
          retention-days: 7
